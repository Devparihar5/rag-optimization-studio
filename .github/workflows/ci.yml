name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q app src tests
      - name: Run tests
        run: pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/selectors.js
          node --check app/static/models.js
          node --check app/static/dataset-upload.js
