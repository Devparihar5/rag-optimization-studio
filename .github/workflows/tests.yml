name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ragstudio/pipeline.py app/main.py tests/test_p1_workflows.py tests/test_pipeline.py --select E4,E7,E9,F
      - name: Test
        run: pytest -q
